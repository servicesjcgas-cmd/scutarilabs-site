<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "ScutariLabs | Privacy-First Security Studio" }}</title>
  <style>
    body { font-family: monospace; background-color: #050709; color: #FFFFFF; margin: 0; line-height: 1.6; }
    nav { padding: 20px 40px; border-bottom: 1px solid #1A2636; background: #0A0E14; }
    nav a { color: #00FF9D; text-decoration: none; font-weight: bold; letter-spacing: 1.2px; font-size: 1.2rem; }
    
    /* Homepage Specific Styles */
    .hero { text-align: center; padding: 80px 20px 40px; }
    .hero h1 { color: #00FF9D; font-size: 2.5rem; margin-bottom: 10px; }
    .hero p { color: #A0AAB5; max-width: 600px; margin: 0 auto; font-size: 1.1rem; }
    .grid { display: flex; gap: 20px; max-width: 900px; margin: 0 auto; padding: 20px; flex-wrap: wrap; justify-content: center; }
    .card { flex: 1; min-width: 280px; max-width: 400px; background: #0A0E14; border: 1px solid #1A2636; padding: 30px; border-radius: 8px; display: flex; flex-direction: column; }
    .card h2 { margin-top: 0; color: #FFFFFF; }
    .card p { color: #A0AAB5; flex-grow: 1; min-height: 50px; }
    .btn { display: inline-block; padding: 12px 24px; background: #1A2636; color: #00FF9D; text-decoration: none; margin-top: 15px; border-radius: 4px; font-weight: bold; border: 1px solid #00FF9D; text-align: center; }
    .btn:hover { background: #00FF9D; color: #050709; }
    
    /* Blog Post Specific Styles */
    .blog-post-container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .blog-post-container h1 { color: #00FF9D; margin-bottom: 5px; }
    .blog-post-container a { color: #00FF9D; }
  </style>
</head>
<body>
  <nav>
    <a href="/">SCUTARILABS</a>
  </nav>

  {{ content }}

</body>
</html>
