<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScutariLabs | {{TITLE}}</title>
  <style>
    /* Base typography and background */
    body { font-family: monospace; background-color: #050709; color: #E0E5EC; margin: 0; line-height: 1.8; font-size: 1.15rem; }
    
    /* Navigation Bar */
    nav { padding: 20px 40px; border-bottom: 1px solid #1A2636; background: #0A0E14; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    nav a { color: #00FF9D; text-decoration: none; font-weight: bold; letter-spacing: 1.2px; font-size: 1.2rem; }
    .nav-links a { margin-left: 20px; font-size: 1rem; color: #A0AAB5; }
    .nav-links a:hover { color: #00FF9D; }
    a { color: #00FF9D; text-decoration: none; }
    
    /* Main Centered Container */
    .blog-container { padding: 60px 20px; max-width: 850px; margin: 0 auto; }
    
    /* Centered Article Header */
    .article-header { text-align: center; margin-bottom: 50px; border-bottom: 1px solid #1A2636; padding-bottom: 30px; }
    .article-header h1 { font-size: 2.8rem; margin-bottom: 15px; color: #00FF9D; line-height: 1.2; }
    .article-header .date { color: #A0AAB5; font-style: italic; font-size: 1.1rem; }
    
    /* Article Body Formatting */
    .blog-content { text-align: left; }
    .blog-content p { margin-bottom: 25px; font-size: 1.2rem; }
    .blog-content h2 { margin-top: 50px; color: #FFFFFF; font-size: 1.8rem; padding-bottom: 10px; }
    .blog-content h3 { color: #A0AAB5; margin-top: 30px; font-size: 1.4rem; }
    .blog-content ul { font-size: 1.15rem; margin-bottom: 25px; line-height: 1.8; }
    .blog-content li { margin-bottom: 12px; }
    .blog-content strong { color: #FFFFFF; }
  </style>
</head>
<body>
  <nav>
    <a href="/">&larr; ScutariLabs Home</a>
    <div class="nav-links">
      <a href="/travelsafe.html">Travel Safe AI</a>
      <a href="/roomclear.html">RoomClear</a>
      <a href="/stillnet.html">Stillnet</a>
    </div>
  </nav>
  
  <div class="blog-container">
    
    <!-- This block centers your title and date prominently at the top -->
    <div class="article-header">
      <h1>{{TITLE}}</h1>
      <span class="date">{{DATE}}</span>
    </div>
    
    <!-- This block holds your generated markdown text -->
    <div class="blog-content">
      {{CONTENT}}
    </div>
    
  </div>
</body>
</html>
